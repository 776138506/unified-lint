# API 文档 - 接口定义
# 阶段 6：定义 API 接口规范

stage: api
id: api-v1

metadata:
  author: "后端开发"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "draft"
  # 扩展字段
  x_api_version: "v1"
  x_base_url: "https://api.example.com"
  x_auth_type: "Bearer Token"

# 覆盖的量化标准
covers_metrics: "metrics-v1"

# API 端点
endpoints:
  # 用户认证接口
  - path: "/api/v1/auth/login"
    method: "POST"
    summary: "用户登录"
    description: "支持用户名密码和 OAuth2.0 登录"
    covers_requirement: "REQ-001"

    # 请求定义
    request:
      content_type: "application/json"
      body:
        type: "object"
        required: ["username", "password"]
        properties:
          username:
            type: "string"
            description: "用户名或邮箱"
            example: "user@example.com"
          password:
            type: "string"
            description: "密码"
            example: "password123"
          remember_me:
            type: "boolean"
            description: "是否记住登录状态"
            default: false
        # 扩展字段
        x_validation_rules:
          - field: "username"
            rule: "email_format"
          - field: "password"
            rule: "min_length:8"

    # 响应定义
    responses:
      - status: 200
        description: "登录成功"
        body:
          type: "object"
          properties:
            token:
              type: "string"
              description: "JWT Token"
            expires_in:
              type: "integer"
              description: "Token 有效期（秒）"
              example: 604800
        # 扩展字段
        x_cacheable: false

      - status: 401
        description: "认证失败"
        body:
          type: "object"
          properties:
            error:
              type: "string"
              description: "错误信息"
            error_code:
              type: "string"
              description: "错误代码"
              example: "INVALID_CREDENTIALS"

    # 性能指标
    performance:
      estimated_latency_ms: 150
      target_availability: 99.99
      # 扩展字段
      x_rate_limit: "10/minute"
      x_circuit_breaker: true

    # 安全要求（扩展点）
    security:
      authentication: false
      authorization: false
      # 扩展字段
      x_input_sanitization: true
      x_sql_injection_protection: true
      x_xss_protection: true

  # 订单查询接口
  - path: "/api/v1/orders"
    method: "GET"
    summary: "查询订单列表"
    description: "分页查询用户的订单列表"
    covers_requirement: "REQ-002"

    # 请求定义
    request:
      content_type: "application/json"
      params:
        - name: "page"
          type: "integer"
          description: "页码"
          default: 1
          min: 1
        - name: "page_size"
          type: "integer"
          description: "每页数量"
          default: 20
          min: 1
          max: 100
        - name: "status"
          type: "string"
          description: "订单状态筛选"
          enum: ["pending", "paid", "shipped", "completed", "cancelled"]
        - name: "start_date"
          type: "string"
          format: "date"
          description: "开始日期"
        - name: "end_date"
          type: "string"
          format: "date"
          description: "结束日期"

    # 响应定义
    responses:
      - status: 200
        description: "查询成功"
        body:
          type: "object"
          properties:
            data:
              type: "array"
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "订单 ID"
                  status:
                    type: "string"
                    description: "订单状态"
                  total_amount:
                    type: "number"
                    description: "订单金额"
                  created_at:
                    type: "string"
                    format: "datetime"
                    description: "创建时间"
            pagination:
              type: "object"
              properties:
                page:
                  type: "integer"
                page_size:
                  type: "integer"
                total:
                  type: "integer"
        # 扩展字段
        x_cacheable: true
        x_cache_ttl: 60

    # 性能指标
    performance:
      estimated_latency_ms: 250
      target_availability: 99.9
      # 扩展字段
      x_pagination_max: 100
      x_default_sort: "created_at:desc"

    # 安全要求
    security:
      authentication: true
      authorization: "user"
      # 扩展字段
      x_data_filtering: "user_id"
      x_rate_limit: "100/minute"

  # 数据导出接口
  - path: "/api/v1/export/orders"
    method: "POST"
    summary: "导出订单数据"
    description: "异步导出订单数据为 CSV"
    covers_requirement: "REQ-003"

    # 请求定义
    request:
      content_type: "application/json"
      body:
        type: "object"
        required: ["format"]
        properties:
          format:
            type: "string"
            enum: ["csv", "xlsx"]
            description: "导出格式"
          filters:
            type: "object"
            properties:
              start_date:
                type: "string"
                format: "date"
              end_date:
                type: "string"
                format: "date"
              status:
                type: "string"
                enum: ["pending", "paid", "shipped", "completed", "cancelled"]
        # 扩展字段
        x_max_date_range_days: 90

    # 响应定义
    responses:
      - status: 202
        description: "导出任务已创建"
        body:
          type: "object"
          properties:
            job_id:
              type: "string"
              description: "导出任务 ID"
            status:
              type: "string"
              description: "任务状态"
              enum: ["pending", "processing", "completed", "failed"]
            estimated_time:
              type: "integer"
              description: "预估完成时间（秒）"

      - status: 400
        description: "请求参数错误"
        body:
          type: "object"
          properties:
            error:
              type: "string"
            details:
              type: "array"
              items:
                type: "object"
                properties:
                  field:
                    type: "string"
                  message:
                    type: "string"

    # 性能指标
    performance:
      estimated_latency_ms: 500
      target_availability: 99.5
      # 扩展字段
      x_async: true
      x_max_concurrent_jobs: 10
      x_job_timeout: "1 hour"

    # 安全要求
    security:
      authentication: true
      authorization: "user"
      # 扩展字段
      x_data_scope: "user_only"
      x_audit_log: true

# 全局配置（扩展点）
global_config:
  cors:
    allowed_origins: ["https://example.com"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE"]
    allowed_headers: ["Authorization", "Content-Type"]
  rate_limiting:
    default: "100/minute"
    burst: "200"
  # 扩展字段
  x_api_gateway: "kong"
  x_load_balancer: "nginx"
  x_ssl_termination: true
