# 部署运维 - 环境与监控
# 阶段 7：定义部署和运维规范

stage: deployment
id: deployment-v1

metadata:
  author: "运维工程师"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "draft"
  # 扩展字段
  x_infra_provider: "阿里云"
  x_region: "cn-hangzhou"

# 覆盖的技术架构
covers_tech_arch: "tech-arch-v1"

# 环境配置
environments:
  - name: "development"
    description: "开发环境"
    url: "https://dev.example.com"
    infrastructure:
      compute:
        type: "ECS"
        spec: "2C4G"
        count: 1
      database:
        type: "RDS PostgreSQL"
        spec: "2C4G"
        storage: "100GB"
      cache:
        type: "Redis"
        spec: "1C2G"
      storage:
        type: "OSS"
        bucket: "dev-exports"
    # 扩展字段
    x_debug_enabled: true
    x_log_level: "DEBUG"
    x_auto_shutdown: "22:00"

  - name: "staging"
    description: "预发布环境"
    url: "https://staging.example.com"
    infrastructure:
      compute:
        type: "ECS"
        spec: "4C8G"
        count: 2
      database:
        type: "RDS PostgreSQL"
        spec: "4C8G"
        storage: "200GB"
      cache:
        type: "Redis"
        spec: "2C4G"
      storage:
        type: "OSS"
        bucket: "staging-exports"
    # 扩展字段
    x_debug_enabled: false
    x_log_level: "INFO"
    x_performance_testing: true

  - name: "production"
    description: "生产环境"
    url: "https://api.example.com"
    infrastructure:
      compute:
        type: "ECS"
        spec: "8C16G"
        count: 3
      database:
        type: "RDS PostgreSQL"
        spec: "8C32G"
        storage: "500GB"
        backup:
          enabled: true
          schedule: "daily"
          retention_days: 30
      cache:
        type: "Redis"
        spec: "4C8G"
      storage:
        type: "OSS"
        bucket: "prod-exports"
    # 扩展字段
    x_debug_enabled: false
    x_log_level: "WARN"
    x_high_availability: true
    x_disaster_recovery: true

# 监控配置
monitoring:
  application:
    metrics:
      - name: "请求延迟"
        type: "histogram"
        labels: ["method", "path", "status"]
      - name: "错误率"
        type: "counter"
        labels: ["method", "path", "error_type"]
      - name: "活跃连接数"
        type: "gauge"
        labels: ["service"]
    # 扩展字段
    x_apm_tool: "SkyWalking"
    x_trace_sampling: 0.1

  infrastructure:
    metrics:
      - name: "CPU 使用率"
        type: "gauge"
        labels: ["instance"]
      - name: "内存使用率"
        type: "gauge"
        labels: ["instance"]
      - name: "磁盘使用率"
        type: "gauge"
        labels: ["instance", "mount_point"]
    # 扩展字段
    x_monitoring_tool: "Prometheus"
    x_visualization: "Grafana"

  logging:
    format: "JSON"
    level: "INFO"
    retention_days: 30
    # 扩展字段
    x_log_aggregation: "ELK Stack"
    x_structured_logging: true

# 告警规则
alerts:
  application:
    - name: "高延迟告警"
      condition: "p95_latency > 500ms for 5 minutes"
      severity: "warning"
      channels: ["slack", "email"]
    - name: "高错误率告警"
      condition: "error_rate > 1% for 3 minutes"
      severity: "critical"
      channels: ["pagerduty", "slack"]
    - name: "服务不可用告警"
      condition: "availability < 99% for 1 minute"
      severity: "critical"
      channels: ["pagerduty", "slack", "sms"]

  infrastructure:
    - name: "CPU 过载告警"
      condition: "cpu_usage > 80% for 10 minutes"
      severity: "warning"
      channels: ["slack"]
    - name: "内存不足告警"
      condition: "memory_usage > 90% for 5 minutes"
      severity: "critical"
      channels: ["pagerduty", "slack"]
    - name: "磁盘空间告警"
      condition: "disk_usage > 85% for 15 minutes"
      severity: "warning"
      channels: ["slack", "email"]

# CI/CD 配置
cicd:
  build:
    trigger: "push to main"
    steps:
      - name: "代码检查"
        command: "unified-lint check ."
      - name: "单元测试"
        command: "pytest tests/"
      - name: "构建镜像"
        command: "docker build -t app:${{ github.sha }} ."
    # 扩展字段
    x_build_tool: "GitHub Actions"
    x_artifact_registry: "Docker Hub"

  deploy:
    environments: ["staging", "production"]
    strategy: "rolling update"
    rollback:
      enabled: true
      trigger: "health check failure"
    # 扩展字段
    x_deployment_tool: "ArgoCD"
    x_canary_enabled: true
    x_canary_percentage: 10

# 运维手册
runbooks:
  - name: "服务重启"
    trigger: "服务无响应"
    steps:
      - "检查服务日志"
      - "重启服务容器"
      - "验证健康检查"
    # 扩展字段
    x_automation_level: "semi-auto"

  - name: "数据库故障"
    trigger: "数据库连接失败"
    steps:
      - "检查数据库状态"
      - "切换到备用数据库"
      - "通知 DBA"
    # 扩展字段
    x_automation_level: "manual"
