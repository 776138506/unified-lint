# 数据模型 - 实体与关系定义
# 定义系统中的数据实体、字段和关系

stage: datamodel
id: datamodel-v1

metadata:
  author: "数据库架构师"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "draft"
  # 扩展字段
  x_database: "PostgreSQL"
  x_orm: "SQLAlchemy"
  x_migration_tool: "Alembic"

# 实体定义
entities:
  - name: "User"
    description: "用户实体"
    table_name: "users"
    # 字段定义
    fields:
      - name: "id"
        type: "uuid"
        primary_key: true
        nullable: false
        description: "用户唯一标识"
        # 扩展字段
        x_default: "gen_random_uuid()"
        x_index: true

      - name: "username"
        type: "varchar(50)"
        unique: true
        nullable: false
        description: "用户名"
        # 扩展字段
        x_validation: "min_length:3, max_length:50"

      - name: "email"
        type: "varchar(100)"
        unique: true
        nullable: false
        description: "邮箱地址"
        # 扩展字段
        x_validation: "email_format"
        x_index: true

      - name: "password_hash"
        type: "varchar(255)"
        nullable: false
        description: "密码哈希"
        # 扩展字段
        x_encryption: "bcrypt"

      - name: "oauth_provider"
        type: "varchar(50)"
        nullable: true
        description: "OAuth 提供商"
        # 扩展字段
        x_enum: ["google", "github", null]

      - name: "oauth_id"
        type: "varchar(100)"
        nullable: true
        description: "OAuth 用户 ID"
        # 扩展字段
        x_unique_with: "oauth_provider"

      - name: "status"
        type: "varchar(20)"
        nullable: false
        default: "active"
        description: "用户状态"
        # 扩展字段
        x_enum: ["active", "inactive", "locked"]

      - name: "created_at"
        type: "timestamp"
        nullable: false
        description: "创建时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"
        x_index: true

      - name: "updated_at"
        type: "timestamp"
        nullable: false
        description: "更新时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"
        x_on_update: "CURRENT_TIMESTAMP"

    # 索引定义
    indexes:
      - name: "idx_users_email"
        fields: ["email"]
        unique: true
      - name: "idx_users_username"
        fields: ["username"]
        unique: true
      - name: "idx_users_status"
        fields: ["status"]
        unique: false

    # 扩展字段
    x_soft_delete: false
    x_audit_log: true
    x_cache_ttl: 300

  - name: "Order"
    description: "订单实体"
    table_name: "orders"
    fields:
      - name: "id"
        type: "uuid"
        primary_key: true
        nullable: false
        description: "订单唯一标识"
        # 扩展字段
        x_default: "gen_random_uuid()"
        x_index: true

      - name: "user_id"
        type: "uuid"
        nullable: false
        description: "用户 ID"
        # 扩展字段
        x_foreign_key: "users.id"
        x_on_delete: "CASCADE"

      - name: "order_number"
        type: "varchar(32)"
        unique: true
        nullable: false
        description: "订单编号"
        # 扩展字段
        x_generation: "auto_increment"
        x_prefix: "ORD"

      - name: "status"
        type: "varchar(20)"
        nullable: false
        default: "pending"
        description: "订单状态"
        # 扩展字段
        x_enum: ["pending", "paid", "shipped", "completed", "cancelled", "refunded"]

      - name: "total_amount"
        type: "decimal(10,2)"
        nullable: false
        description: "订单总金额"
        # 扩展字段
        x_min: 0.01
        x_max: 999999.99

      - name: "currency"
        type: "varchar(3)"
        nullable: false
        default: "CNY"
        description: "货币类型"
        # 扩展字段
        x_enum: ["CNY", "USD", "EUR"]

      - name: "payment_method"
        type: "varchar(50)"
        nullable: true
        description: "支付方式"
        # 扩展字段
        x_enum: ["alipay", "wechat", "credit_card", null]

      - name: "paid_at"
        type: "timestamp"
        nullable: true
        description: "支付时间"

      - name: "shipped_at"
        type: "timestamp"
        nullable: true
        description: "发货时间"

      - name: "completed_at"
        type: "timestamp"
        nullable: true
        description: "完成时间"

      - name: "cancelled_at"
        type: "timestamp"
        nullable: true
        description: "取消时间"

      - name: "created_at"
        type: "timestamp"
        nullable: false
        description: "创建时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"
        x_index: true

      - name: "updated_at"
        type: "timestamp"
        nullable: false
        description: "更新时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"
        x_on_update: "CURRENT_TIMESTAMP"

    indexes:
      - name: "idx_orders_user_id"
        fields: ["user_id"]
        unique: false
      - name: "idx_orders_status"
        fields: ["status"]
        unique: false
      - name: "idx_orders_created_at"
        fields: ["created_at"]
        unique: false
      - name: "idx_orders_order_number"
        fields: ["order_number"]
        unique: true

    # 扩展字段
    x_soft_delete: false
    x_audit_log: true
    x_state_machine: true

  - name: "ExportJob"
    description: "导出任务实体"
    table_name: "export_jobs"
    fields:
      - name: "id"
        type: "uuid"
        primary_key: true
        nullable: false
        description: "任务唯一标识"
        # 扩展字段
        x_default: "gen_random_uuid()"

      - name: "user_id"
        type: "uuid"
        nullable: false
        description: "用户 ID"
        # 扩展字段
        x_foreign_key: "users.id"
        x_on_delete: "CASCADE"

      - name: "status"
        type: "varchar(20)"
        nullable: false
        default: "pending"
        description: "任务状态"
        # 扩展字段
        x_enum: ["pending", "processing", "completed", "failed"]

      - name: "format"
        type: "varchar(10)"
        nullable: false
        description: "导出格式"
        # 扩展字段
        x_enum: ["csv", "xlsx"]

      - name: "filters"
        type: "jsonb"
        nullable: true
        description: "筛选条件"
        # 扩展字段
        x_schema: "ExportFilters"

      - name: "file_path"
        type: "varchar(500)"
        nullable: true
        description: "文件路径"

      - name: "file_size"
        type: "bigint"
        nullable: true
        description: "文件大小（字节）"

      - name: "record_count"
        type: "integer"
        nullable: true
        description: "记录数量"

      - name: "expires_at"
        type: "timestamp"
        nullable: true
        description: "过期时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP + INTERVAL '24 hours'"

      - name: "created_at"
        type: "timestamp"
        nullable: false
        description: "创建时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"

      - name: "updated_at"
        type: "timestamp"
        nullable: false
        description: "更新时间"
        # 扩展字段
        x_default: "CURRENT_TIMESTAMP"
        x_on_update: "CURRENT_TIMESTAMP"

    indexes:
      - name: "idx_export_jobs_user_id"
        fields: ["user_id"]
        unique: false
      - name: "idx_export_jobs_status"
        fields: ["status"]
        unique: false
      - name: "idx_export_jobs_expires_at"
        fields: ["expires_at"]
        unique: false

    # 扩展字段
    x_soft_delete: false
    x_audit_log: true
    x_cleanup_job: true

# 实体关系
relations:
  - name: "user_orders"
    type: "one_to_many"
    from: "User"
    to: "Order"
    foreign_key: "user_id"
    # 扩展字段
    x_cascade_delete: true
    x_lazy_loading: false

  - name: "user_export_jobs"
    type: "one_to_many"
    from: "User"
    to: "ExportJob"
    foreign_key: "user_id"
    # 扩展字段
    x_cascade_delete: true
    x_lazy_loading: true

# 数据约束
constraints:
  - name: "order_amount_positive"
    type: "check"
    entity: "Order"
    condition: "total_amount > 0"
    description: "订单金额必须为正数"

  - name: "order_status_transition"
    type: "trigger"
    entity: "Order"
    condition: "状态流转必须符合业务规则"
    description: "订单状态只能按特定顺序流转"
    # 扩展字段
    x_valid_transitions:
      pending: ["paid", "cancelled"]
      paid: ["shipped", "refunded"]
      shipped: ["completed"]
      completed: []
      cancelled: []
      refunded: []

# 数据迁移策略
migrations:
  strategy: "incremental"
  tool: "Alembic"
  # 扩展字段
  x_auto_generate: true
  x_backup_before: true
  x_rollback_support: true
