# 变更日志 - 项目变更历史
# 记录所有规范的变更历史

stage: changelog
id: changelog-v1

metadata:
  author: "系统"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "active"
  # 扩展字段
  x_total_entries: 3
  x_auto_generated: true

# 变更条目
entries:
  - id: CHANGE-001
    timestamp: "2026-06-12T10:00:00Z"
    author: "产品经理"
    type: "requirement"
    # 变更目标
    target:
      file: "prd.yaml"
      element_id: "REQ-001"
      field: "acceptance_criteria"
    # 变更内容
    changes:
      old_value:
        - "支持用户名密码登录"
        - "支持 OAuth2.0 第三方登录"
      new_value:
        - "支持用户名密码登录"
        - "支持 OAuth2.0 第三方登录（Google、GitHub）"
        - "登录状态保持 7 天"
        - "支持记住密码功能"
    # 变更原因
    reason: "补充验收标准，明确 OAuth 提供商和会话管理要求"
    # 影响分析
    impact:
      affected_components: ["AuthService", "API 登录接口"]
      risk_level: "low"
      review_required: false
    # 扩展字段
    x_review_status: "approved"
    x_reviewer: "架构师"
    x_review_date: "2026-06-12"

  - id: CHANGE-002
    timestamp: "2026-06-12T14:30:00Z"
    author: "架构师"
    type: "architecture"
    target:
      file: "biz-arch.yaml"
      element_id: "AuthService"
      field: "interfaces"
    changes:
      old_value:
        - name: "IAuthProvider"
          methods:
            - name: "authenticate"
            - name: "refreshToken"
      new_value:
        - name: "IAuthProvider"
          methods:
            - name: "authenticate"
            - name: "refreshToken"
            - name: "revokeToken"
    reason: "新增 Token 撤销功能，支持用户主动退出登录"
    impact:
      affected_components: ["AuthService", "API 登出接口"]
      risk_level: "medium"
      review_required: true
    # 扩展字段
    x_review_status: "pending"
    x_reviewer: "后端开发"
    x_review_date: null

  - id: CHANGE-003
    timestamp: "2026-06-12T16:00:00Z"
    author: "架构师"
    type: "metrics"
    target:
      file: "metrics.yaml"
      element_id: "latency"
      field: "p95_ms"
    changes:
      old_value: 250
      new_value: 200
    reason: "根据用户反馈，提高性能要求"
    impact:
      affected_components: ["所有 API 接口"]
      risk_level: "high"
      review_required: true
    # 扩展字段
    x_review_status: "approved"
    x_reviewer: "产品经理"
    x_review_date: "2026-06-12"
    x_justification: "用户体验优先，需要优化性能"

# 变更统计
statistics:
  total: 3
  by_type:
    requirement: 1
    architecture: 1
    metrics: 1
  by_status:
    approved: 2
    pending: 1
  # 扩展字段
  x_last_change: "2026-06-12T16:00:00Z"
  x_change_frequency: "daily"
  x_review_turnaround_hours: 4

# 变更规则（扩展点）
rules:
  # 自动化规则
  automation:
    - name: "自动通知"
      trigger: "change_created"
      action: "notify_reviewers"
      channels: ["slack", "email"]
    - name: "自动关联"
      trigger: "change_approved"
      action: "update_changelog"
      target: "changelog.yaml"
  # 审查规则
  review:
    - name: "高风险变更"
      condition: "risk_level == 'high'"
      action: "require_approval"
      approvers: ["产品经理", "架构师"]
    - name: "架构变更"
      condition: "type == 'architecture'"
      action: "require_review"
      reviewers: ["架构师"]
