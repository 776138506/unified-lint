# 业务架构 - 领域模块设计
# 阶段 2：定义业务模块和覆盖关系

stage: biz-arch
id: biz-arch-v1

metadata:
  author: "架构师"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "draft"
  # 扩展字段
  x_architecture_pattern: "DDD"
  x_domain_count: 3

# 覆盖的需求
covers_requirements:
  - REQ-001
  - REQ-002
  - REQ-003

# 领域模块
modules:
  - name: "AuthService"
    description: "用户认证与授权服务"
    covers_requirements:
      - REQ-001
    responsibilities:
      - "用户认证（用户名密码、OAuth2.0）"
      - "Token 管理（生成、验证、刷新）"
      - "会话管理"
      - "账户锁定与解锁"
    interfaces:
      - name: "IAuthProvider"
        methods:
          - name: "authenticate"
            params:
              - name: "credentials"
                type: "Credentials"
            returns: "AuthResult"
          - name: "refreshToken"
            params:
              - name: "token"
                type: "string"
            returns: "Token"
    # 扩展字段
    x_security_level: "high"
    x_stateful: true

  - name: "OrderService"
    description: "订单管理服务"
    covers_requirements:
      - REQ-002
    responsibilities:
      - "订单创建与支付"
      - "订单查询与分页"
      - "订单状态流转"
      - "退款处理"
    interfaces:
      - name: "IOrderService"
        methods:
          - name: "createOrder"
            params:
              - name: "orderData"
                type: "OrderDTO"
            returns: "Order"
          - name: "getOrders"
            params:
              - name: "userId"
                type: "string"
              - name: "page"
                type: "int"
              - name: "pageSize"
                type: "int"
            returns: "PagedResult<Order>"
    # 扩展字段
    x_payment_gateway: "stripe"
    x_event_driven: true

  - name: "ExportService"
    description: "数据导出服务"
    covers_requirements:
      - REQ-003
    responsibilities:
      - "数据查询与筛选"
      - "CSV 生成"
      - "异步导出"
      - "文件存储与过期"
    interfaces:
      - name: "IExportService"
        methods:
          - name: "exportOrders"
            params:
              - name: "filters"
                type: "ExportFilters"
              - name: "format"
                type: "ExportFormat"
            returns: "ExportJob"
          - name: "getExportStatus"
            params:
              - name: "jobId"
                type: "string"
            returns: "ExportStatus"
    # 扩展字段
    x_async: true
    x_storage_backend: "oss"

# 模块依赖关系
dependencies:
  - from: "OrderService"
    to: "AuthService"
    type: "sync"
    reason: "订单需要验证用户身份"
  - from: "ExportService"
    to: "OrderService"
    type: "async"
    reason: "导出需要查询订单数据"

# 领域事件（扩展点）
domain_events:
  - name: "UserAuthenticated"
    source: "AuthService"
    consumers: ["OrderService"]
  - name: "OrderCreated"
    source: "OrderService"
    consumers: ["ExportService"]
  - name: "OrderCancelled"
    source: "OrderService"
    consumers: ["ExportService"]

# 业务流程（扩展点）
business_flows:
  - name: "用户登录流程"
    steps:
      - step: 1
        action: "用户提交凭证"
        service: "AuthService"
      - step: 2
        action: "验证凭证"
        service: "AuthService"
      - step: 3
        action: "生成 Token"
        service: "AuthService"
      - step: 4
        action: "返回登录结果"
        service: "AuthService"
