# 功能拆分 - 功能点与优先级
# 将需求拆分为可实现的功能点

stage: features
id: features-v1

metadata:
  author: "产品经理"
  created: "2026-06-12"
  updated: "2026-06-12"
  version: "1.0"
  status: "draft"
  # 扩展字段
  x_total_features: 8
  x_sprint_count: 3

# 覆盖的需求
covers_requirements:
  - REQ-001
  - REQ-002
  - REQ-003

# 功能列表
features:
  # 用户登录功能
  - id: FEAT-001
    name: "用户名密码登录"
    requirement: "REQ-001"
    priority: "P0"
    status: "draft"
    description: "支持用户名密码登录"
    # 功能点
    function_points:
      - id: FP-001
        name: "登录表单"
        description: "用户名和密码输入框"
        complexity: "low"
      - id: FP-002
        name: "凭证验证"
        description: "验证用户名密码"
        complexity: "medium"
      - id: FP-003
        name: "Token 生成"
        description: "生成 JWT Token"
        complexity: "medium"
    # 验收标准
    acceptance_criteria:
      - "用户输入正确的用户名密码，成功登录"
      - "用户输入错误的用户名密码，显示错误信息"
      - "登录成功后跳转到首页"
    # 扩展字段
    x_story_points: 5
    x_sprint: 1
    x_assignee: "后端开发"

  - id: FEAT-002
    name: "OAuth2.0 登录"
    requirement: "REQ-001"
    priority: "P0"
    status: "draft"
    description: "支持 OAuth2.0 第三方登录"
    function_points:
      - id: FP-004
        name: "OAuth 提供商配置"
        description: "配置 Google、GitHub 等提供商"
        complexity: "medium"
      - id: FP-005
        name: "OAuth 回调处理"
        description: "处理 OAuth 回调"
        complexity: "high"
      - id: FP-006
        name: "账户关联"
        description: "关联 OAuth 账户和本地账户"
        complexity: "high"
    acceptance_criteria:
      - "用户点击 Google 登录，跳转到 Google 授权页面"
      - "用户授权后，自动创建或关联本地账户"
      - "登录成功后跳转到首页"
    # 扩展字段
    x_story_points: 8
    x_sprint: 1
    x_assignee: "后端开发"

  - id: FEAT-003
    name: "会话管理"
    requirement: "REQ-001"
    priority: "P0"
    status: "draft"
    description: "管理用户会话和 Token"
    function_points:
      - id: FP-007
        name: "Token 刷新"
        description: "自动刷新过期 Token"
        complexity: "medium"
      - id: FP-008
        name: "记住密码"
        description: "记住用户登录状态"
        complexity: "low"
      - id: FP-009
        name: "退出登录"
        description: "清除登录状态"
        complexity: "low"
    acceptance_criteria:
      - "Token 过期后自动刷新"
      - "用户勾选记住密码，下次自动登录"
      - "用户点击退出，清除登录状态"
    # 扩展字段
    x_story_points: 3
    x_sprint: 1
    x_assignee: "后端开发"

  # 订单管理功能
  - id: FEAT-004
    name: "创建订单"
    requirement: "REQ-002"
    priority: "P0"
    status: "draft"
    description: "用户可以创建订单"
    function_points:
      - id: FP-010
        name: "订单表单"
        description: "填写订单信息"
        complexity: "medium"
      - id: FP-011
        name: "订单验证"
        description: "验证订单数据"
        complexity: "medium"
      - id: FP-012
        name: "订单保存"
        description: "保存订单到数据库"
        complexity: "medium"
    acceptance_criteria:
      - "用户填写订单信息，点击提交"
      - "系统验证订单数据"
      - "订单创建成功，显示订单详情"
    # 扩展字段
    x_story_points: 5
    x_sprint: 2
    x_assignee: "后端开发"

  - id: FEAT-005
    name: "订单列表"
    requirement: "REQ-002"
    priority: "P0"
    status: "draft"
    description: "用户可以查看订单列表"
    function_points:
      - id: FP-013
        name: "订单查询"
        description: "查询用户订单"
        complexity: "medium"
      - id: FP-014
        name: "分页显示"
        description: "分页显示订单列表"
        complexity: "low"
      - id: FP-015
        name: "状态筛选"
        description: "按状态筛选订单"
        complexity: "low"
    acceptance_criteria:
      - "用户可以看到自己的订单列表"
      - "订单列表支持分页"
      - "用户可以按状态筛选订单"
    # 扩展字段
    x_story_points: 3
    x_sprint: 2
    x_assignee: "后端开发"

  - id: FEAT-006
    name: "取消订单"
    requirement: "REQ-002"
    priority: "P0"
    status: "draft"
    description: "用户可以取消未支付的订单"
    function_points:
      - id: FP-016
        name: "取消按钮"
        description: "显示取消按钮"
        complexity: "low"
      - id: FP-017
        name: "取消确认"
        description: "确认取消操作"
        complexity: "low"
      - id: FP-018
        name: "状态更新"
        description: "更新订单状态"
        complexity: "medium"
    acceptance_criteria:
      - "未支付的订单显示取消按钮"
      - "用户点击取消，显示确认对话框"
      - "确认后订单状态变为 cancelled"
    # 扩展字段
    x_story_points: 2
    x_sprint: 2
    x_assignee: "后端开发"

  # 数据导出功能
  - id: FEAT-007
    name: "订单导出"
    requirement: "REQ-003"
    priority: "P1"
    status: "draft"
    description: "支持导出订单数据为 CSV"
    function_points:
      - id: FP-019
        name: "导出表单"
        description: "选择导出条件"
        complexity: "low"
      - id: FP-020
        name: "异步导出"
        description: "异步生成导出文件"
        complexity: "high"
      - id: FP-021
        name: "文件下载"
        description: "下载导出文件"
        complexity: "medium"
    acceptance_criteria:
      - "用户选择时间范围和状态"
      - "系统异步生成导出文件"
      - "用户可以下载导出文件"
    # 扩展字段
    x_story_points: 8
    x_sprint: 3
    x_assignee: "后端开发"

  - id: FEAT-008
    name: "导出管理"
    requirement: "REQ-003"
    priority: "P1"
    status: "draft"
    description: "管理导出任务"
    function_points:
      - id: FP-022
        name: "任务列表"
        description: "显示导出任务列表"
        complexity: "low"
      - id: FP-023
        name: "状态查看"
        description: "查看任务状态"
        complexity: "low"
      - id: FP-024
        name: "文件过期"
        description: "文件 24 小时后过期"
        complexity: "medium"
    acceptance_criteria:
      - "用户可以看到导出任务列表"
      - "用户可以查看任务状态"
      - "文件 24 小时后自动删除"
    # 扩展字段
    x_story_points: 3
    x_sprint: 3
    x_assignee: "后端开发"

# 功能依赖
dependencies:
  - from: "FEAT-002"
    to: "FEAT-001"
    type: "strong"
    reason: "OAuth 登录依赖基础登录功能"

  - from: "FEAT-004"
    to: "FEAT-001"
    type: "strong"
    reason: "创建订单需要用户登录"

  - from: "FEAT-007"
    to: "FEAT-005"
    type: "weak"
    reason: "导出订单需要订单列表功能"

# 迭代计划
sprints:
  - id: 1
    name: "Sprint 1"
    features: ["FEAT-001", "FEAT-002", "FEAT-003"]
    duration: "2 weeks"
    # 扩展字段
    x_start_date: "2026-06-15"
    x_end_date: "2026-06-28"

  - id: 2
    name: "Sprint 2"
    features: ["FEAT-004", "FEAT-005", "FEAT-006"]
    duration: "2 weeks"
    # 扩展字段
    x_start_date: "2026-06-29"
    x_end_date: "2026-07-12"

  - id: 3
    name: "Sprint 3"
    features: ["FEAT-007", "FEAT-008"]
    duration: "2 weeks"
    # 扩展字段
    x_start_date: "2026-07-13"
    x_end_date: "2026-07-26"
