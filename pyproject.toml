[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-lint"
version = "0.1.0"
description = "Unified linter: code rules (GritQL) + doc rules (GritQL) + arch rules (import-linter)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "import-linter>=2.0",
    "rich>=13.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
unified-lint = "unified_lint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
